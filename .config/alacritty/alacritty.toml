[colors]
[colors.primary]
background = "#000000"
foreground = "#FFFFFF"
# Normal colors
[colors.normal]
black   = '#000000'
red     = '#cd0000'
green   = '#00cd00'
yellow  = '#cdcd00'
blue    = '#0000ee'
magenta = '#cd00cd'
cyan    = '#00cdcd'
white   = '#e5e5e5'

# Bright colors
[colors.bright]
black   = '#7f7f7f'
red     = '#ff0000'
green   = '#00ff00'
yellow  = '#ffff00'
blue    = '#5c5cff'
magenta = '#ff00ff'
cyan    = '#00ffff'
white   = '#ffffff'
[font]
normal = { family = "FiraCode NerdFont Mono", style="Retina" }
size = 12
[terminal]
# shell = { program = "/bin/zsh", args = ["-l"] }
[env]
WINIT_X11_SCALE_FACTOR= "1.0"
